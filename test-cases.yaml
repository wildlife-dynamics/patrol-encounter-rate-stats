# Test cases for patrol_encounter_rate_stats
#
# All development cases run with mock_io: true against the task libraries'
# shipped example-return fixtures — no credentials needed. The live mep_dev
# case is added in Phase 3 (reconnect), together with the EarthRanger env
# vars in .github/workflows/test.yml.

base:
  name: Base
  description: Mocked IO — primary development case (no credentials needed).
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    summary_groupby:
      vars: ["patrol_subject"]

grouped:
  name: Grouped
  description: >-
    Mocked IO — value grouper (patrol serial number) plus monthly temporal
    grouper; hits both temporal-index tasks and the string casts.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers:
        - index_name: "patrol_serial_number"
        - temporal_index: "%B"
    summary_groupby:
      vars: ["patrol_subject"]

spatial-grouped:
  name: Spatial Grouped
  description: >-
    Mocked IO — spatial grouper: the mock get_spatial_features_group fixture
    returns the "SpatialGrouperTest" group (Central/East/West regions),
    hitting the resolver tasks and add_spatial_index on both branches.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers:
        - spatial_index_name: "SpatialGrouperTest"
    summary_groupby:
      vars: ["patrol_subject"]

zero-events:
  name: Zero Events
  description: >-
    Mocked IO — event_types filter matches nothing, so the events branch
    empties and skips; concat_dataframes drops the skip sentinel and
    ensure_columns keeps the summary computable: the table must still render
    with Total Events = 0 and effort columns populated (AC 5).
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: ["no_such_event_type"]
    groupers:
      groupers: []
    summary_groupby:
      vars: ["patrol_subject"]

by-patrol-type:
  name: By Patrol Type
  description: >-
    Mocked IO — multi-column Aggregator [patrol_subject, patrol_type];
    exercises multi-column grouping and header renames.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    summary_groupby:
      vars: ["patrol_subject", "patrol_type"]
