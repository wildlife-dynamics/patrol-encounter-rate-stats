        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers:
        - index_name: "patrol_serial_number"
        - temporal_index: "%B"
    summary_groupers:
      groupers:
        - index_name: "patrol_subject"

