# Test cases for patrol_encounter_rate_stats
#
# All development cases run with mock_io: true against the task libraries'
# shipped example-return fixtures — no credentials needed. The live mep_dev
# case is added in Phase 3 (reconnect), together with the EarthRanger env
# vars in .github/workflows/test.yml.

base:
  name: Base
  description: >-
    Mocked IO — primary development case (no credentials needed); mirrors the
    form defaults (Aggregator = Patrol Type).
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    summary_groupers:
      groupers:
        - index_name: "patrol_type"

grouped:
  name: Grouped
  description: >-
    Mocked IO — value grouper (patrol serial number) plus monthly temporal
    grouper; hits both temporal-index tasks and the string casts.
  mock_io: true
  params:
    workflow_details:
