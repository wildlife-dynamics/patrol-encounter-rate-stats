# Test cases for patrol_encounter_rate_stats
#
# All development cases run with mock_io: true against the task libraries'
# shipped example-return fixtures — no credentials needed. The mep-dev case
# runs live against EarthRanger and needs the
# ECOSCOPE_WORKFLOWS__CONNECTIONS__EARTHRANGER__MEP_DEV__* env vars (added to
# .github/workflows/test.yml at publish).
#
# Coverage matrix (every Aggregator dropdown option appears at least once):
#   Category presets: patrol_type (base, by-patrol-type, mep-dev),
#     patrol_subject (zero-events, by-patrol-type),
#     patrol_serial_number (metric-subset)
#   Time formats: %B (grouped), %Y / %Y-%m / %Y-%m-%d (calendar-aggregators),
#     %j / %d / %A / %H (subday-aggregators)
#   Spatial: both the Group Data and Aggregator resolver chains (spatial)
#   Idempotency guards: temporal (grouped: %B on both sides),
#     spatial (spatial: same group on both sides)

base:
  name: Base
  description: >-
    Mocked IO — primary development case (no credentials needed); mirrors the
    form defaults (Aggregator = Patrol Type).
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    summary_groupers:
      groupers:
        - index_name: "patrol_type"

grouped:
  name: Grouped
  description: >-
    Mocked IO — value grouper (patrol serial number) plus monthly temporal
    grouper in Group Data, with Month (%B) ALSO as the Aggregator: hits both
    temporal-index tasks, the string casts, the TemporalGrouper_%B -> "Month"
    header rename, and the add_temporal_index idempotency guard (the %B index
    level added by the Group Data pass must not be re-added by the
    aggregator pass).
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers:
        - index_name: "patrol_serial_number"
        - temporal_index: "%B"
    summary_groupers:
      groupers:
        - temporal_index: "%B"

spatial:
  name: Spatial
  description: >-
    Mocked IO — spatial grouper on BOTH sides: Group Data and the Aggregator
    each resolve the mock "SpatialGrouperTest" group (Central/East/West),
    exercising both independent resolver chains (extract -> fetch -> resolve),
    add_spatial_index on both branches, and the add_spatial_index idempotency
    guard (the shared index level must not be re-added by the second pass).
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers:
        - spatial_index_name: "SpatialGrouperTest"
    summary_groupers:
      groupers:
        - spatial_index_name: "SpatialGrouperTest"

zero-events:
  name: Zero Events
  description: >-
    Mocked IO — event_types filter matches nothing, so the events branch
    empties and skips; concat_dataframes drops the skip sentinel and
    ensure_columns keeps the summary computable: the table must still render
    with Total Events = 0 and effort columns populated (AC 5). Aggregator =
    Patrol Subject.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: ["no_such_event_type"]
    groupers:
      groupers: []
    summary_groupers:
      groupers:
        - index_name: "patrol_subject"

