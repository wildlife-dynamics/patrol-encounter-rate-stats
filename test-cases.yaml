metric-subset:
  name: Metric Subset
  description: >-
    Mocked IO — non-default metric picker: unit overrides (distance in m,
    rate per day), patrol presets (patrol count / patrol days), and the
    per-patrol / per-patrol-day rates, exercising
    set_encounter_rate_metrics -> summarize_df wiring (preset order defines
    column order).
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
