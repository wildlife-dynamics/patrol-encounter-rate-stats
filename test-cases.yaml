# Test cases for patrol_encounter_rate_stats
#
# Mock cases run with mock_io: true. Flag-on cases (patrol leg schema) use the
# synthetic fixtures under dev/fixtures/legs (dev/fixtures/build_leg_fixtures.py:
# 2 patrols, 3 legs, 9 events, 2 members + 1 asset per leg) via
# mock_io_overrides; flag-off cases keep the task libraries' packaged 2015
# fixtures and add only the leg frames the library builds from them
# (dev/fixtures/flag-off, name columns "None"). The mep-dev cases run live
# against EarthRanger and need the
# ECOSCOPE_WORKFLOWS__CONNECTIONS__EARTHRANGER__MEP_DEV__* env vars.
#
# Expected numbers on the leg fixtures (pinned from the first green run):
# Total Encounters 9, Total Duration 10 h (the trajectory joins the one-hour gap
# between legs 1 and 2 into a track segment), Events per Hour 0.90, Total
# Distance 34.86 km; Active Duration 9 h, Elapsed Duration 10 h, Leg Count 3,
# Member-days 6; per member (explode) 9 events, 9 h, Member-days 3; spatial
# LegTestRegions 6.69 h West / 2.31 h East, Leg Count 3 each, events 6 / 3.
#
# The cmp-2015-* cases are the pre-change cases verbatim (plus the flag-off leg
# frames): dev/compare_before_after.py checks every shared column against the
# before snapshot taken on the unmodified spec (.scratch/before, gitignored).

base:
  name: Base
  description: >-
    Mocked IO on the leg fixtures — form defaults (Summarize-by Patrol Type, the default three metrics): one row, Total Encounters 9, Total Duration 10 h, Events per Hour 0.90, Total Distance 34.86 km, Events per Km 0.26.
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_patrols_from_combined_params: dev/fixtures/legs/patrols.parquet
    ecoscope.platform.tasks.io.get_patrol_observations_from_patrols_df_and_combined_params: dev/fixtures/legs/observations.parquet
    ecoscope.platform.tasks.io.get_patrol_segments_from_patrols_df_and_combined_params: dev/fixtures/legs/legs.parquet
    ecoscope.platform.tasks.io.add_patrol_team_names: dev/fixtures/legs/legs-team-names.parquet
    ecoscope.platform.tasks.io.add_patrol_roster_names: dev/fixtures/legs/legs-roster-names.parquet
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2026-01-05T00:00:00"
      until: "2026-01-07T00:00:00"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["ecoscope_leg_test"]
      event_types: []
    groupers:
      groupers: []
    summary_groupers:
      groupers:
        - index_name: "patrol_type"

