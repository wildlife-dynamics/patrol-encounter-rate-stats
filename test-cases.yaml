        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    summary_groupers:
      groupers:
        - index_name: "patrol_subject"
    summary_metrics:
      metrics:
        - metric: "patrol_count"
        - metric: "patrol_days"
        - metric: "total_distance"
          unit: "m"
        - metric: "events_per_duration"
          unit: "d"
        - metric: "events_per_distance"
          unit: "km"
        - metric: "events_per_patrol"
        - metric: "events_per_patrol_day"
