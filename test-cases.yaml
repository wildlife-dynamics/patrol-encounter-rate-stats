      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    summary_groupers:
      groupers:
        - index_name: "patrol_subject"
        - index_name: "patrol_type"

metric-subset:
  name: Metric Subset
  description: >-
    Mocked IO — non-default metric picker: unit overrides (distance in m,
    rate per day), patrol presets (patrol count / patrol days), and the
    per-patrol / per-patrol-day rates, exercising
    set_encounter_rate_metrics -> summarize_df wiring (preset order defines
    column order). Aggregator = Patrol Serial Number, completing the
    Category presets.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Stats"
      description: "Per-category encounter rate summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    summary_groupers:
      groupers:
        - index_name: "patrol_serial_number"
    summary_metrics:
      metrics:
        - metric: "patrol_count"
        - metric: "patrol_days"
        - metric: "total_distance"
          unit: "m"
        - metric: "encounters_per_duration"
          unit: "d"
        - metric: "encounters_per_distance"
          unit: "km"
        - metric: "encounters_per_patrol"
        - metric: "encounters_per_patrol_day"

